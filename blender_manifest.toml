[permissions]
# The only listener is the execution bridge on 127.0.0.1; the agent CLI is a
# child process on this machine and reaches the network on its own account.
network = "Listen on localhost so the bundled MCP server can drive Blender"
files = "Read and write scene files and the agent's working directory"

# Keep agent notes and pin lists out of the installable zip.
[build]
paths_exclude_pattern = [
  "__pycache__/",
  "**/AGENTS.md",
  "/requirements-*.txt",
]
