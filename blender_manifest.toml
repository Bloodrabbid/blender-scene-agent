schema_version = "1.0.0"

id = "blender_scene_agent"
version = "1.0.1"
name = "Scene Agent"
tagline = "Drive Blender from your own Claude Code or Codex CLI"
maintainer = "Local build"
type = "add-on"

blender_version_min = "5.1.0"
license = ["SPDX:GPL-3.0-or-later"]
platforms = ["macos-arm64", "macos-x64", "windows-x64", "linux-x64"]

